name: Run analysis

on:
  workflow_dispatch:
  push:
    paths:
      - analysis.py
      - requirements.txt
      - data/**
      - raw_pipeline/**
      - DATA.md
      - README.md
      - .github/workflows/run-analysis.yml

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python analysis.py
      - uses: actions/upload-artifact@v6
        with:
          name: manuscript-output
          path: |
            figures/
            data/processed/herbal/
