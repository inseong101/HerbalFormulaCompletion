name: Analysis

on:
  workflow_dispatch:
  push:
    paths:
      - run.py
      - requirements.txt
      - src/**
      - data/herbal/**
      - data/food.csv
      - data/results.xlsx
      - Colab.ipynb
      - README.md
      - data/README.md
      - .github/workflows/run.yml

permissions:
  contents: read

jobs:
  figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python run.py
      - uses: actions/upload-artifact@v6
        with:
          name: manuscript-figures
          path: figures/
